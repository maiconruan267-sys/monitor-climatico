name: Atualizar clima e publicar
on:
  push:
    branches: [main]
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Forçar nova coleta de todas as cidades (teste de desempenho)'
        type: boolean
        default: false
        required: false
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
concurrency:
  group: monitor-climatico
  cancel-in-progress: false
jobs:
  atualizar:
    if: github.event_name != 'issues' || ((startsWith(github.event.issue.title, '[Cadastro de cidade]') || startsWith(github.event.issue.title, '[Remoção de cidade]')) && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar cliente HTTP
        run: python -m pip install -r requirements.txt
      - name: Validar regras de histórico e cadastro
        run: python -m unittest discover -s tests
      - name: Aplicar solicitação de cidade
        if: github.event_name == 'issues'
        run: python scripts/register_city.py
      - name: Salvar cadastro compartilhado
        if: github.event_name == 'issues'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _sistema/Locais.csv _sistema/locais.js
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar cadastro de cidades do monitor'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Consultar clima e preservar histórico
        id: coleta
        timeout-minutes: 75
        if: github.event_name != 'push' && !startsWith(github.event.issue.title, '[Remoção de cidade]')
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh || false }}
        run: python scripts/update_weather.py
      - name: Salvar dados e progresso no repositório
        if: always() && steps.coleta.outcome != 'skipped' && steps.coleta.outcome != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _sistema/dados_clima.js historico/
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar clima e histórico diário'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preparar site
        run: |
          mkdir -p public/_sistema
          cp index.html .nojekyll public/
          cp _sistema/dados_clima.js _sistema/malhas.js _sistema/locais.js public/_sistema/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

